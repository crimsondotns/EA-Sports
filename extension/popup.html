<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EA Drawing</title>
<style>
  /* Tokens: docs/design-system.md (dark canvas, white primary, neutral states). */
  :root {
    color-scheme: dark;
    --color-bg: #000000;
    --color-surface: #0a0a0a;
    --color-text-primary: #ffffff;
    --color-text-secondary: #b4b4b4;
    --color-text-muted: #777777;
    --color-border: #2a2a2a;
    --color-focus: #ffffff;
    --color-button-primary-bg: #ffffff;
    --color-button-primary-text: #000000;
    --color-button-primary-hover: #eaeaea;
    --color-button-primary-pressed: #d6d6d6;
    --color-danger: #f87171;
    --radius-pill: 999px;
    --transition-fast: 140ms ease-out;
    --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    /* Compact density for a 320px extension popup: body 13px, metadata 12px, controls 14px. */
    --font-size-body: 13px;
    --font-size-small: 12px;
    --font-size-control: 14px;
    --font-size-title: 15px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-bg); color: var(--color-text-primary);
    font: var(--font-size-body)/1.45 var(--font-sans); }
  body { width: 320px; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  header h1 { font-size: var(--font-size-title); font-weight: 600; margin: 0; line-height: 1.2; }
  header p { margin: 0; color: var(--color-text-muted); font-size: var(--font-size-small); }
  section { padding: 12px 0; border-top: 1px solid var(--color-border); }
  section p { margin: 0 0 12px; color: var(--color-text-secondary); }
  section p:last-child { margin-bottom: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .row > span:first-child { color: var(--color-text-secondary); flex: none; }
  .row > span:last-child { text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .neg { color: var(--color-danger); }
  .button-primary { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 18px;
    border: 1px solid transparent; border-radius: var(--radius-pill); background: var(--color-button-primary-bg);
    color: var(--color-button-primary-text); font-family: inherit; font-size: var(--font-size-control); font-weight: 600; line-height: 1.2;
    text-decoration: none; cursor: pointer; transition: background-color var(--transition-fast); }
  .button-primary:active { background: var(--color-button-primary-pressed); }
  .button-primary:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px; }
  @media (hover: hover) and (pointer: fine) {
    .button-primary:hover { background: var(--color-button-primary-hover); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <header>
    <img src="icon48.png" alt="">
    <div><h1>EA Drawing</h1><p id="subtitle">Draws on the DEX Screener chart</p></div>
  </header>
  <section>
    <p>From the pair's daily bars: lines 90% and 95% below the ATH close, a Fib retracement from the ATL to the ATH close and an Anchored VWAP from the first bar. Existing drawings are left as they are.</p>
  </section>
  <main id="main" aria-live="polite"></main>
  <script src="dist/popup.js"></script>
</body>
</html>
