<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EA Volume Breakout</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000; --surface: #0a0a0a; --elevated: #171717; --hover: #202020;
    --text: #ffffff; --text-2: #b4b4b4; --muted: #777777;
    --border: #2a2a2a; --border-strong: #444444;
    --danger: #f87171; --success: #4ade80; --warning: #fbbf24;
    --radius: 10px; --t: 140ms ease;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { width: 340px; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.2; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  section { padding: 12px 0; border-top: 1px solid var(--border); }
  h2 { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 0 8px; }
  .num { font-variant-numeric: tabular-nums; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  .row > span:first-child { color: var(--text-2); }
  .signal { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .pos, .ok { color: var(--success); } .neg { color: var(--danger); } .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface); border-radius: var(--radius); padding: 8px 10px; }
  .stat small { display: block; color: var(--muted); font-size: 11px; }
  .stat strong { font-weight: 600; }
  .empty { color: var(--text-2); }
  .empty p { margin: 0 0 12px; }

  /* Switch rows: the whole label is clickable */
  label.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px;
    margin: 0 -10px; border-radius: var(--radius); cursor: pointer; transition: background-color var(--t); }
  label.switch:hover { background: var(--hover); }
  label.switch small { display: block; color: var(--muted); font-size: 11px; }
  label.switch input { appearance: none; flex: none; width: 34px; height: 20px; border-radius: 999px; margin: 0;
    background: #333; position: relative; cursor: pointer; transition: background-color var(--t); }
  label.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
    border-radius: 50%; background: #777; transition: transform var(--t), background-color var(--t); }
  label.switch input:checked { background: #fff; }
  label.switch input:checked::after { transform: translateX(14px); background: #000; }
  label.switch input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .button-primary { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 18px;
    border: 1px solid transparent; border-radius: 999px; background: #fff; color: #000; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.2;
    text-decoration: none; cursor: pointer; transition: background-color var(--t); }
  .button-primary:hover { background: #eaeaea; }
  .button-primary:active { background: #d6d6d6; }
  .button-primary:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  /* Strategy dropdown: trigger styled as a text input, menu as an elevated surface.
     A custom listbox, because a native <select> menu is drawn by the OS and can't follow the spec. */
  .dropdown { position: relative; }
  .dropdown-trigger { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px;
    padding: 0 12px; border: 1px solid #333; border-radius: var(--radius); background: #141414; color: var(--text);
    font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.2; text-align: left; cursor: pointer;
    transition: border-color var(--t); }
  .dropdown-trigger:hover { border-color: #555; }
  .dropdown-trigger:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-color: #888; }
  .dropdown-trigger[aria-expanded="true"] { border-color: #888; }
  .dropdown-trigger svg { flex: none; color: var(--text-2); transition: transform var(--t); }
  .dropdown-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }
  .dropdown-menu { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px;
    list-style: none; background: var(--elevated); border: 1px solid #303030; border-radius: var(--radius); }
  .dropdown-menu[hidden] { display: none; }
  /* Focus sits on the list; the highlighted row (plus its ring when using the keyboard) shows where it is. */
  .dropdown-menu:focus { outline: none; }
  .dropdown-menu:focus-visible li.active { outline: 2px solid var(--text); outline-offset: -2px; }
  .dropdown-menu li { position: relative; display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  /* Hint: tooltip on the hovered / keyboard-highlighted option */
  .dropdown-menu li .tip { position: absolute; z-index: 1; top: calc(100% + 4px); left: 34px; right: 8px; padding: 6px 10px;
    background: var(--hover); border: 1px solid var(--border-strong); border-radius: 8px; color: var(--text-2);
    font-size: 12px; line-height: 1.45; pointer-events: none; opacity: 0; visibility: hidden;
    transition: opacity var(--t), visibility var(--t); }
  .dropdown-menu li.active .tip { opacity: 1; visibility: visible; }
  /* Last option: open the tooltip upwards so it stays inside the popup */
  .dropdown-menu li:last-child .tip { top: auto; bottom: calc(100% + 4px); }
  .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  .dropdown-menu li .check { flex: none; width: 16px; padding-top: 1px; visibility: hidden; }
  .dropdown-menu li[aria-selected="true"] .check { visibility: visible; }
  .dropdown-menu li.active { background: var(--hover); }
  footer { color: var(--muted); font-size: 11px; padding-top: 8px; }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <header>
    <img src="icon48.png" alt="">
    <div><h1 id="title">EA Signals</h1><p id="subtitle">DEX Screener signals</p></div>
  </header>
  <section>
    <h2 id="strategyLabel">Strategy</h2>
    <div class="dropdown">
      <button type="button" class="dropdown-trigger" id="strategyTrigger" aria-haspopup="listbox" aria-expanded="false"
        aria-labelledby="strategyLabel strategyValue">
        <span id="strategyValue">Deep Dip</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ul class="dropdown-menu" id="strategyMenu" role="listbox" aria-labelledby="strategyLabel" tabindex="-1" hidden>
        <li role="option" id="opt-breakout" data-value="breakout" aria-selected="false" aria-describedby="tip-breakout">
          <svg class="check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="name">Volume Breakout</span><span class="tip" role="tooltip" id="tip-breakout">Chase momentum after a volume spike</span>
        </li>
        <li role="option" id="opt-quiet" data-value="quiet" aria-selected="false" aria-describedby="tip-quiet">
          <svg class="check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="name">Quiet Accumulation</span><span class="tip" role="tooltip" id="tip-quiet">Buy deep and quiet, free ride</span>
        </li>
        <li role="option" id="opt-dip" data-value="dip" aria-selected="false" aria-describedby="tip-dip">
          <svg class="check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="name">Deep Dip</span><span class="tip" role="tooltip" id="tip-dip">Under EMA 9/21/200, MACD turning up · best on 15m</span>
        </li>
      </ul>
    </div>
    <p class="hint" id="strategyHint"></p>
  </section>
  <main id="main"></main>
  <section>
    <h2>Settings</h2>
    <label class="switch"><span>Table on chart<small>Compact table in the chart's top-right corner</small></span><input type="checkbox" id="showTable"></label>
    <label class="switch"><span>Buy / sell markers<small>Draw backtest entries and exits on the chart</small></span><input type="checkbox" id="drawMarkers"></label>
    <label class="switch"><span>Strategy indicators<small>Add the EMAs, MACD, RSI or volume the strategy uses</small></span><input type="checkbox" id="showIndicators"></label>
    <label class="switch"><span>Notifications<small>Alert when a new bar closes with a signal</small></span><input type="checkbox" id="notify"></label>
  </section>
  <footer>Backtest signals only — not financial advice.</footer>
  <script src="dist/popup.js"></script>
</body>
</html>
