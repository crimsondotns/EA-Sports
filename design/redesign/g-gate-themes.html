<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G · Gate, dark and light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* F's layout, E's type (Manrope) and E's on-chart pill, in a dark and a light theme. */
  :root, [data-theme="dark"] {
    --page: #0a0a0a; --bg: #000; --card: #111; --raised: #1a1a1a; --line: #262626;
    --text: #f2f2f2; --text-2: #a3a3a3; --muted: #6b6b6b;
    --go: #4ade80; --go-soft: rgb(74 222 128 / 14%); --stop: #f87171; --near: #fbbf24; --near-soft: rgb(251 191 36 / 14%);
    --invert: #fff; --on-invert: #000; --shadow: none;
  }
  [data-theme="light"] {
    --page: #e9ebef; --bg: #f5f6f8; --card: #fff; --raised: #eef0f3; --line: #e3e6eb;
    --text: #14161a; --text-2: #5a606b; --muted: #9aa0aa;
    --go: #0e9f6e; --go-soft: #e3f6ee; --stop: #d92d20; --near: #b54708; --near-soft: #fdf1e3;
    --invert: #14161a; --on-invert: #fff; --shadow: 0 1px 2px rgb(20 22 26 / 8%), 0 8px 24px rgb(20 22 26 / 8%);
  }
  * { box-sizing: border-box; margin: 0; }
  html { font-family: "Manrope", system-ui, sans-serif; }
  body { background: var(--page); color: var(--text); padding: 32px 24px 64px; transition: background-color 160ms ease-out; }
  .num { font-variant-numeric: tabular-nums; }
  .page-head { max-width: 1560px; margin: 0 auto 24px; display: flex; gap: 24px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .page-head h1 { font-size: 22px; font-weight: 800; }
  .page-head p { color: var(--text-2); font-size: 14px; margin-top: 6px; max-width: 72ch; line-height: 1.55; }
  .board { display: flex; flex-wrap: wrap; gap: 32px; max-width: 1560px; margin: 0 auto; align-items: flex-start; }
  figure { display: grid; gap: 10px; }
  figcaption { color: var(--muted); font-size: 12px; }

  /* Theme switch: the same control lives in the popup header. */
  .theme { display: inline-grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .theme button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--text-2); }
  .theme button[aria-pressed="true"] { background: var(--invert); color: var(--on-invert); }
  .theme button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .theme svg { width: 14px; height: 14px; }
  .theme.small button { padding: 4px 8px; }
  .theme.small span { display: none; }

  .popup { width: 360px; background: var(--bg); border-radius: 14px; overflow: hidden; font-size: 13px; box-shadow: var(--shadow), 0 0 0 1px var(--line); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 14px 0; }
  .top b { font-size: 17px; font-weight: 800; }
  .sub { padding: 2px 14px 0; color: var(--muted); font-size: 12px; }

  .gate { padding: 16px 14px 14px; }
  .score { display: flex; align-items: baseline; gap: 10px; }
  .score b { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: .95; }
  .score span { color: var(--text-2); font-size: 14px; }
  .meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 14px 0 12px; }
  .meter div { border-top: 5px solid var(--line); border-radius: 3px 3px 0 0; padding-top: 8px; }
  .meter div.ok { border-color: var(--go); }
  .meter small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
  .meter b { font-size: 15px; font-weight: 800; }
  .meter div.ok b { color: var(--go); }
  .meter div.need b { color: var(--near); }
  .hint { background: var(--card); border-radius: 10px; padding: 10px 12px; color: var(--text-2); line-height: 1.45; }
  .hint b { color: var(--near); font-weight: 700; }

  .head2 { display: flex; justify-content: space-between; padding: 12px 14px 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600; }
  .rows { list-style: none; padding: 0; }
  .rows li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); }
  .rows .p { font-weight: 700; font-size: 14px; }
  .rows small { display: block; color: var(--muted); font-size: 11.5px; }
  .seg3 { display: flex; gap: 3px; }
  .seg3 i { width: 12px; height: 5px; border-radius: 3px; background: var(--line); }
  .seg3 i.ok { background: var(--go); }
  .st { font-weight: 800; font-size: 14px; text-align: right; min-width: 60px; }
  .go { color: var(--go); } .no { color: var(--stop); } .ny { color: var(--near); } .mu { color: var(--muted); }
  .bottom { display: flex; justify-content: space-between; padding: 12px 14px; border-top: 1px solid var(--line); color: var(--text-2); }
  .bottom b { color: var(--text); font-weight: 700; }
  .hold .score b { color: var(--go); }
  .plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; margin-top: 12px; }
  .plan div { background: var(--card); padding: 8px 10px; }
  .plan small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
  .plan b { font-size: 15px; font-weight: 800; }

  .set { padding: 4px 12px 16px; }
  .group { background: var(--card); border-radius: 12px; padding: 4px 14px; margin-top: 8px; }
  .group h3 { font-size: 12px; font-weight: 700; color: var(--text-2); padding: 10px 0 2px; }
  .line { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .group h3 + .line { border-top: 0; }
  .sw { width: 36px; height: 22px; border-radius: 999px; background: var(--invert); position: relative; }
  .sw::after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--on-invert); }
  .sw.off { background: var(--line); } .sw.off::after { left: 3px; right: auto; background: var(--muted); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 8px 0 4px; }
  .seg span { text-align: center; padding: 9px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); font-weight: 700; color: var(--text-2); }
  .seg .on { box-shadow: inset 0 0 0 1px var(--text); color: var(--text); }
  .btn { margin: 8px 0 12px; height: 42px; border-radius: 12px; background: var(--invert); color: var(--on-invert); font-weight: 800; display: grid; place-items: center; }

  /* E's pill: a gate badge, the mini gate and the state; it opens into the checks. */
  .stage { width: 640px; height: 300px; position: relative; background: #131722; border-radius: 12px; overflow: hidden; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pill { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 10px; background: var(--bg); color: var(--text); border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 13px; box-shadow: 0 0 0 1px var(--line); }
  .pill .m { display: flex; gap: 2px; }
  .pill .m i { width: 10px; height: 6px; border-radius: 3px; background: var(--line); }
  .pill .m i.ok { background: var(--go); }
  .pill b { font-weight: 800; }
  .pill span { color: var(--text-2); font-size: 12px; }
  .pill .badge { background: var(--invert); color: var(--on-invert); border-radius: 999px; padding: 3px 9px; font-weight: 800; font-size: 12px; }
  .drop { position: absolute; top: 52px; right: 12px; width: 220px; background: var(--bg); color: var(--text); border-radius: 12px; padding: 12px; font-size: 12.5px; display: grid; gap: 6px; box-shadow: 0 0 0 1px var(--line); }
  .drop div { display: flex; justify-content: space-between; }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>
<body>
<header class="page-head">
  <div>
    <h1>G · Gate, dark and light</h1>
    <p>F's layout with E's type and E's on-chart pill. One switch in the popup header flips the popup and the chart pill between dark and light; try it here.</p>
  </div>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-set="dark" aria-pressed="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Dark</span></button>
    <button type="button" data-set="light" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></button>
  </div>
</header>
<div class="board">
  <figure>
    <div class="popup">
      <div class="top"><b>Ban / SOL</b>
        <div class="theme small" role="group" aria-label="Theme">
          <button type="button" data-set="dark" aria-pressed="true" aria-label="Dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Dark</span></button>
          <button type="button" data-set="light" aria-pressed="false" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></button>
        </div></div>
      <div class="sub">Sharp Low · 15m · this tab · last bar closed 10:15</div>
      <div class="gate num">
        <div class="score"><b>2/3</b><span>buy checks passed</span></div>
        <div class="meter">
          <div class="ok"><small>20-bar low</small><b>50.20M</b></div>
          <div class="ok"><small>Close in bar</small><b>64%</b></div>
          <div class="need"><small>Fall in 6 bars</small><b>6.2% / 10%</b></div>
        </div>
        <p class="hint">Needs <b>3.8% more fall</b> on a bar that still closes in its upper half.</p>
      </div>
      <div class="head2"><span>Other open pairs</span><span>4</span></div>
      <ul class="rows num">
        <li><div><span class="p">ASTEROID / SOL</span><small>15m</small></div><div class="seg3"><i class="ok"></i><i class="ok"></i><i class="ok"></i></div><div class="st go">Buy</div></li>
        <li><div><span class="p">MOMO / SOL</span><small>15m · holding</small></div><div></div><div class="st go">+123.5%</div></li>
        <li><div><span class="p">CASHCAT / ETH</span><small>1h · 2.1% to zone</small></div><div class="seg3"><i class="ok"></i><i class="ok"></i><i></i></div><div class="st ny">Near</div></li>
        <li><div><span class="p">PENGU / SOL</span><small>1h</small></div><div class="seg3"><i></i><i></i><i></i></div><div class="st mu">Wait</div></li>
      </ul>
      <div class="bottom"><span>Alerts on</span><b>Settings</b></div>
    </div>
    <figcaption>Popup on a waiting pair</figcaption>
  </figure>

  <figure>
    <div class="popup hold">
      <div class="top"><b>MOMO / SOL</b><span class="mu" style="font-size:12px">Sharp Low · 15m</span></div>
      <div class="sub">This tab · holding since 21 Oct 08:15</div>
      <div class="gate num">
        <div class="score"><b>+123.5%</b><span>open</span></div>
        <div class="plan"><div><small>Bought</small><b>74.30K</b></div><div><small>Stop</small><b class="no">54.58K</b></div><div><small>Sell 10% at</small><b>RSI 80</b></div></div>
        <p class="hint" style="margin-top:12px">RSI is 73. The next 10% sells on the first close at 80 or higher.</p>
      </div>
      <div class="head2"><span>Other open pairs</span><span>4</span></div>
      <ul class="rows num">
        <li><div><span class="p">ASTEROID / SOL</span><small>15m</small></div><div class="seg3"><i class="ok"></i><i class="ok"></i><i class="ok"></i></div><div class="st go">Buy</div></li>
        <li><div><span class="p">Ban / SOL</span><small>15m</small></div><div class="seg3"><i class="ok"></i><i class="ok"></i><i></i></div><div class="st mu">Wait</div></li>
      </ul>
      <div class="bottom"><span>Alerts on</span><b>Settings</b></div>
    </div>
    <figcaption>Holding: the gate becomes the trade plan</figcaption>
  </figure>

  <figure>
    <div class="popup">
      <div class="top"><b>Settings</b><span class="mu" style="font-size:12px">Done</span></div>
      <div class="set">
        <div class="group"><h3>Appearance</h3>
          <div class="seg"><span class="on">Dark</span><span>Light</span></div></div>
        <div class="group"><h3>History</h3>
          <div class="seg"><span class="on">Last 31 days</span><span>Pair start</span></div>
          <div class="btn">Recalculate this pair</div></div>
        <div class="group"><h3>On the chart</h3>
          <div class="line"><span>Signal pill</span><span class="sw"></span></div>
          <div class="line"><span>Buy and sell markers</span><span class="sw"></span></div>
          <div class="line"><span>Stop line</span><span class="sw"></span></div>
          <div class="line"><span>Indicators</span><span class="sw off"></span></div></div>
        <div class="group"><h3>Alerts</h3>
          <div class="line"><span>Notify on new signals</span><span class="sw"></span></div></div>
      </div>
    </div>
    <figcaption>Settings, with the theme also here</figcaption>
  </figure>

  <figure>
    <div class="stage">
      <svg class="chart"></svg>
      <div class="pill num"><span class="badge">2/3</span><div class="m"><i class="ok"></i><i class="ok"></i><i></i></div><b>Waiting</b><span>Sharp Low 15m</span></div>
      <div class="drop num">
        <div><span>✓ 20-bar low</span><span>50.20M</span></div>
        <div><span>✓ Upper-half close</span><span>64%</span></div>
        <div><span class="ny">○ Fell 10%</span><span class="ny">6.2%</span></div>
      </div>
    </div>
    <figcaption>On-chart pill (E), opened; follows the theme</figcaption>
  </figure>
</div>
<script src="chart.js"></script>
<script>
  // Every theme switch on the page flips the whole board and stays in sync.
  const set = (t) => {
    document.documentElement.dataset.theme = t;
    for (const b of document.querySelectorAll(".theme button")) b.setAttribute("aria-pressed", String(b.dataset.set === t));
  };
  for (const b of document.querySelectorAll(".theme button")) b.addEventListener("click", () => set(b.dataset.set));
</script>
</body>
</html>
